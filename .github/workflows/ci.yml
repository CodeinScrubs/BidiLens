name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: GitHub Actions syntax and semantics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

  quality:
    name: Quality (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.27.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm -r --if-present run example

  cross-platform:
    name: Cross-platform quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.27.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm -r --if-present run example

  packages:
    name: Packed consumer (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.27.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run packages:types
      - run: pnpm run release:check

  android:
    name: Android libraries and sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      - run: chmod +x android/gradlew
      - run: >-
          ./android/gradlew -p android
          :core:testDebugUnitTest
          :views:testDebugUnitTest
          :compose:testDebugUnitTest
          :core:lintRelease
          :views:lintRelease
          :compose:lintRelease
          :sample:lintDebug
          :core:assembleRelease
          :views:assembleRelease
          :compose:assembleRelease
          :sample:assembleDebug
          publishToMavenLocal
          --stacktrace --console=plain
      - run: >-
          ./android/gradlew -p android/consumer-smoke
          clean assembleDebug
          --stacktrace --console=plain
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bidilens-android-artifacts
          path: |
            android/*/build/outputs/aar/*.aar
            android/sample/build/outputs/apk/debug/*.apk
            android/*/build/reports/lint-results-*.html
          if-no-files-found: error

  android-device:
    name: Android UI tests (API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      - run: chmod +x android/gradlew
      - name: Enable KVM group access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: >-
            for attempt in $(seq 1 60); do
            if adb -s "emulator-${EMULATOR_PORT}" shell cmd package list packages >/dev/null 2>&1;
            then break; fi;
            if [ "$attempt" -eq 60 ];
            then echo "::error::Android package service did not become ready.";
            exit 1; fi;
            sleep 2;
            done;
            ./android/gradlew -p android
            :views:connectedDebugAndroidTest
            :compose:connectedDebugAndroidTest
            --stacktrace --console=plain

  apple:
    name: Apple Swift package and iOS adapter
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test Swift core and shared corpus
        run: swift test
      - name: Compile the UIKit adapter
        run: >-
          xcodebuild
          -scheme BidiLens
          -destination 'generic/platform=iOS Simulator'
          -sdk iphonesimulator
          CODE_SIGNING_ALLOWED=NO
          build

  windows-native:
    name: Windows core, WPF adapter, and sample
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 8.0.423
          cache: false
      - name: Build and run native verification
        working-directory: windows
        run: |
          dotnet build tests/BidiLens.Tests/BidiLens.Tests.csproj --configuration Release
          dotnet run --project tests/BidiLens.Tests/BidiLens.Tests.csproj --configuration Release --no-build
          dotnet build samples/BidiLens.Wpf.Sample/BidiLens.Wpf.Sample.csproj --configuration Release
          dotnet pack src/BidiLens.Core/BidiLens.Core.csproj --configuration Release --no-build
          dotnet pack src/BidiLens.Wpf/BidiLens.Wpf.csproj --configuration Release --no-build

  security-and-sbom:
    name: Dependency audit and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.27.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deps:audit
      - run: pnpm run sbom
      - run: pnpm run sbom:check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bidilens-cyclonedx-sbom
          path: bidilens-sbom.cdx.json
          if-no-files-found: error

  visual:
    # The committed pixel baselines were captured with Windows Arial. Keep
    # screenshot comparison on that OS; Linux behavior is still exercised by
    # the semantic, build, and packed-consumer jobs above.
    name: Visual on Windows (${{ matrix.browser }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.27.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm run build:visual-fixtures
      - run: pnpm exec playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-${{ matrix.browser }}-failure
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
