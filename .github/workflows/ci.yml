name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: GitHub Actions syntax and semantics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

  quality:
    name: Quality (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            runtime: 22.12.0
          - node: 24
            runtime: 24.15.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.27.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.runtime }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm -r --if-present run example

  cross-platform:
    name: Cross-platform quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.27.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm -r --if-present run example

  packages:
    name: Packed consumer (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            runtime: 22.12.0
          - node: 24
            runtime: 24.15.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.27.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.runtime }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run packages:types
      - run: pnpm run release:check

  markdown-it-compat:
    name: Markdown-It 13 and 14 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.27.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run markdown-it:compat
        env:
          BIDILENS_MARKDOWN_IT_REPORT_DIR: markdown-it-compat-reports
      - if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: markdown-it-compat-reports
          path: markdown-it-compat-reports
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android libraries and sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      - run: chmod +x android/gradlew
      - run: >-
          ./android/gradlew -p android
          :core:testDebugUnitTest
          :views:testDebugUnitTest
          :compose:testDebugUnitTest
          :core:lintRelease
          :views:lintRelease
          :compose:lintRelease
          :sample:lintDebug
          :core:assembleRelease
          :views:assembleRelease
          :compose:assembleRelease
          :sample:assembleDebug
          publishToMavenLocal
          --stacktrace --console=plain
      - run: >-
          ./android/gradlew -p android/consumer-smoke
          clean assembleDebug
          --stacktrace --console=plain
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bidilens-android-artifacts
          path: |
            android/*/build/outputs/aar/*.aar
            android/sample/build/outputs/apk/debug/*.apk
            android/*/build/reports/lint-results-*.html
          if-no-files-found: error

  android-device:
    name: Android UI tests (API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      - run: chmod +x android/gradlew
      - name: Enable KVM group access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: >-
            for attempt in $(seq 1 60); do
            if adb -s "emulator-${EMULATOR_PORT}" shell cmd package list packages >/dev/null 2>&1;
            then break; fi;
            if [ "$attempt" -eq 60 ];
            then echo "::error::Android package service did not become ready.";
            exit 1; fi;
            sleep 2;
            done;
            ./android/gradlew -p android
            :views:connectedDebugAndroidTest
            :compose:connectedDebugAndroidTest
            --stacktrace --console=plain

  apple:
    name: Apple Swift package and iOS adapter
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test Swift core and shared corpus
        run: swift test
      - name: Test UIKit and SwiftUI adapters
        shell: bash
        run: |
          set -euo pipefail
          device_id="$(
            xcrun simctl list devices available -j |
              python3 -c '
          import json
          import sys

          devices = json.load(sys.stdin)["devices"]
          for runtime in devices.values():
              for device in runtime:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator was found.")
          '
          )"
          xcodebuild test \
            -scheme BidiLens-Package \
            -destination "platform=iOS Simulator,id=${device_id}" \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO
      - name: Compile the UIKit and SwiftUI adapters
        run: >-
          xcodebuild
          -scheme BidiLens
          -destination 'generic/platform=iOS Simulator'
          -sdk iphonesimulator
          CODE_SIGNING_ALLOWED=NO
          build

  windows-native:
    name: Windows core, WPF adapter, and sample
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.423
          cache: false
      - name: Build and run native verification
        working-directory: windows
        run: |
          dotnet build tests/BidiLens.Tests/BidiLens.Tests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/BidiLens.Tests/BidiLens.Tests.csproj --configuration Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build samples/BidiLens.Wpf.Sample/BidiLens.Wpf.Sample.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack src/BidiLens.Core/BidiLens.Core.csproj --configuration Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack src/BidiLens.Wpf/BidiLens.Wpf.csproj --configuration Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  rust-native:
    name: Rust core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the minimum supported Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo +1.85.0 fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Check all targets
        run: cargo +1.85.0 check --manifest-path rust/Cargo.toml --all-targets
      - name: Lint all targets
        run: cargo +1.85.0 clippy --manifest-path rust/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Test core, shared corpus, and example
        run: cargo +1.85.0 test --manifest-path rust/Cargo.toml --all-targets

  security-and-sbom:
    name: Dependency audit and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.27.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deps:audit
      - run: pnpm run sbom
      - run: pnpm run sbom:check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bidilens-cyclonedx-sbom
          path: bidilens-sbom.cdx.json
          if-no-files-found: error

  visual:
    # The committed pixel baselines were captured with Windows Arial. Keep
    # screenshot comparison on that OS; Linux behavior is still exercised by
    # the semantic, build, and packed-consumer jobs above.
    name: Visual on Windows (${{ matrix.browser }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.27.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm run build:visual-fixtures
      - run: pnpm exec playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-${{ matrix.browser }}-failure
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
