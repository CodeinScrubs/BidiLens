name: Release preparation (disabled by default)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    if: ${{ vars.BIDILENS_RELEASE_ENABLED == 'true' }}
    # Pixel snapshots are Windows/Arial baselines; the regular CI workflow
    # independently runs quality and package consumers on Ubuntu.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.27.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run changeset:status
      - run: pnpm run check
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm run test:visual
      - run: pnpm run packages:types
      - run: pnpm run markdown-it:compat
      - run: pnpm run deps:audit
      - run: pnpm run release:check
      - run: pnpm run sbom
      - run: pnpm run sbom:check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bidilens-release-preparation
          path: bidilens-sbom.cdx.json
          if-no-files-found: error

      # This workflow only prepares evidence. Registry mutation is isolated in
      # publish.yml behind the npm-release environment and an exact human
      # confirmation phrase.
