version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      # Keep compile-time platform types aligned with the Node 22/24 runtime
      # matrix. Adopting a newer major belongs in a deliberate runtime review.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # TypeScript majors can change emitted/declaration behavior and must be
      # validated together with the typescript-eslint compatibility range.
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major
      # jsdom 30 requires Node 22.22.2 or 24.15.0. Keep the development
      # harness compatible with the public Node 22.12 runtime floor until a
      # deliberate BidiLens major/minor compatibility decision raises it.
      - dependency-name: "jsdom"
        update-types:
          - version-update:semver-major
      # markdown-it 15 changes its TypeScript surface: the constructor no
      # longer serves as the instance type and renderer callbacks lose the
      # contextual types used by older adapters. BidiLens now uses a
      # version-neutral structural boundary; keep future major updates paired
      # with the source-build and packed consumer compatibility gates.
      - dependency-name: "markdown-it"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # Kotlin 2.4.10 is fully supported through Gradle 9.5. Keep the Android
      # wrapper at that compatibility boundary until JetBrains expands it.
      - dependency-name: "gradle-wrapper"
        versions:
          - "[9.6,)"

  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
