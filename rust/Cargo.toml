[package]
name = "bidilens-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native Rust direction analysis and isolation planning for mixed bidirectional text"
license = "MIT"
repository = "https://github.com/CodeinScrubs/BidiLens"
readme = "README.md"
keywords = ["bidi", "rtl", "unicode", "i18n", "text"]
categories = ["internationalization", "text-processing"]
publish = false

[dependencies]
regex = "1.11"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
