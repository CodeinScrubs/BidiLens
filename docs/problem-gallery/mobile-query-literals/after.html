<!doctype html><html lang="en"><meta charset="utf-8"><title>Literal search syntax inside Persian prose</title><style>
  html { background:#f3f4f6; color:#171717; font-family:Arial,sans-serif; }
  body { margin:0; }
  #sample { box-sizing:border-box; width:760px; padding:24px; background:white; }
  p { margin:0 0 12px; font-size:23px; line-height:1.8; }
  p:last-child { margin-bottom:0; }
  bdi, code, pre { unicode-bidi:isolate; }
  h2 { font-size:25px; }
  li, blockquote, td, th { font-size:19px; line-height:1.7; }

html { background:#101014; color:#f5f5f5; } #sample { width:390px; background:#101014; padding:20px; } p { font-size:19px; } h2 { font-size:22px; } li, blockquote { font-size:18px; } pre { background:#222228; overflow-wrap:anywhere; }</style><main id="sample" dir="rtl" style="text-align:left"><h2 dir="rtl" data-bidilens-block="" class="bidilens-block"><bdi dir="ltr" data-bidilens-isolate="" data-bidilens-kind="opposite-direction-run">Search</bdi> این الگوها را دقیق وارد کنید.</h2>
<p dir="rtl" data-bidilens-block="" class="bidilens-block">برای جستجوی واژه، <code dir="ltr" data-bidilens-code="" class="bidilens-code">\bTB\b</code> را وارد کنید.</p>
<p dir="rtl" data-bidilens-block="" class="bidilens-block">الگوی دیگر <code dir="ltr" data-bidilens-code="" class="bidilens-code">%TB%</code> است.</p>
<p dir="rtl" data-bidilens-block="" class="bidilens-block">این نمونهٔ نحوی <code dir="ltr" data-bidilens-code="" class="bidilens-code">[[:&lt;:]]TB[[:&gt;:]]</code> را نیز بدون تغییر نگه دارید.</p>
<blockquote dir="rtl" data-bidilens-block="" class="bidilens-block">
<p dir="rtl" data-bidilens-block="" class="bidilens-block">نتیجه‌ها را مقایسه کنید؛ جهت نمایش نباید رشتهٔ جستجو را تغییر دهد.</p>
</blockquote>
<pre><code dir="ltr" data-bidilens-code="" class="bidilens-code language-text">\bTB\b
%TB%
[[:&lt;:]]TB[[:&gt;:]]
</code></pre>
